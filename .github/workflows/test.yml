name: CI

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  adapters:
    name: Foundry adapters
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install dependencies
        # Bare `forge install` initializes every .gitmodules dependency
        # (forge-std + seed-protocol) at the committed submodule revisions.
        run: forge install

      - name: Run Forge build
        run: forge build --sizes

      - name: Run Forge tests
        run: forge test -vvv

  web:
    name: Web unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # version comes from package.json's "packageManager" field
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # pnpm 11 (pinned via packageManager) needs Node >= 22.13
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure env (dev defaults, no secrets)
        run: cp apps/web/.env.example apps/web/.env.local

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test
